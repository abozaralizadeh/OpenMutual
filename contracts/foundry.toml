[profile.default]
src = "src"
test = "test"
out = "out"
cache_path = "cache"
libs = ["../node_modules"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
  "@openzeppelin/=../node_modules/@openzeppelin/",
  "forge-std/=../node_modules/forge-std/src/",
]

[fuzz]
runs = 512

[invariant]
runs = 128
depth = 64
fail_on_revert = false
